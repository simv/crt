name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
      - name: plugin manifests are valid JSON
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/hooks/hooks.json','utf8'))"
      - name: claude plugin validate (F-36…F-41)
        shell: bash
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate ./plugin
          npx -y @anthropic-ai/claude-code@latest plugin validate .

  e2e:
    # Both runners on main: the fake-codex axis (PRD-providers F-61, N-10) exercises the npm .cmd shim on Windows.
    # Job names are what the main ruleset requires: "e2e (ubuntu)" is a required status check.
    # Windows e2e (~5 min, mostly the browser install) runs only on pushes to main: PRs get the
    # ubuntu e2e plus the Windows unit job, which already drives the fake codex through the .cmd shim.
    name: e2e (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"ubuntu-latest","name":"ubuntu"},{"os":"windows-latest","name":"windows"}]' || '[{"os":"ubuntu-latest","name":"ubuntu"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install playwright browsers
        run: npx --workspace packages/server playwright install --with-deps chromium
        if: hashFiles('packages/server/playwright.config.ts') != ''
      - run: npm run e2e --if-present
