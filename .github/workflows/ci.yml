name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
      - name: plugin manifests are valid JSON
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/hooks/hooks.json','utf8'))"
      - name: claude plugin validate (F-36…F-41)
        shell: bash
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate ./plugin
          npx -y @anthropic-ai/claude-code@latest plugin validate .

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install playwright browsers
        run: npx --workspace packages/server playwright install --with-deps chromium
        if: hashFiles('packages/server/playwright.config.ts') != ''
      - run: npm run e2e --if-present
