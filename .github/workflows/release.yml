name: release

# Tag v* on main → build → publish claude-review-tool to npm → GitHub Release.
# Requires repo secret NPM_TOKEN (granular token with publish rights, 2FA bypass).
# No --provenance: npm only attests builds from public repositories, and this one is private.
# If the repo goes public, add `--provenance` back to the publish step and `id-token: write`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/server/package.json').version")
          test "$TAG" = "$PKG" || { echo "tag $TAG != package version $PKG"; exit 1; }
      - run: npm publish --workspace packages/server --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
