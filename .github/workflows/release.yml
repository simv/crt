name: release

# Tag v* on main → build → publish claude-review-tool to npm → GitHub Release.
# Requires repo secret NPM_TOKEN (granular token with publish rights, 2FA bypass).
# The repo is public, so `npm publish --provenance` attests the build (needs `id-token: write`).
# Actions are pinned to full commit SHAs (repo setting "Require actions to be pinned").

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/server/package.json').version")
          test "$TAG" = "$PKG" || { echo "tag $TAG != package version $PKG"; exit 1; }
      - run: npm publish --workspace packages/server --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
