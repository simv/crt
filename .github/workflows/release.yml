name: release

# Tag v* on main → build → publish claude-review-tool to npm → GitHub Release.
# Publishes with npm trusted publishing (OIDC): the package on npmjs.com trusts this repository's
# `release.yml`, so no NPM_TOKEN is needed — `id-token: write` lets npm mint a short-lived token and
# provenance is attested automatically. Trusted publishing needs npm ≥ 11.5.1; Node 22 ships npm 10,
# hence the upgrade step. The job declares no `environment:`; the npm trust entry must leave it blank.
# Actions are pinned to full commit SHAs (repo setting "Require actions to be pinned").

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - name: version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/server/package.json').version")
          test "$TAG" = "$PKG" || { echo "tag $TAG != package version $PKG"; exit 1; }
      - run: npm publish --workspace packages/server --access public --provenance
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
